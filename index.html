<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawg Arcade</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame { background: #0b0b0b; border-radius: 1vw; box-shadow: 0 0 0 0.4vw #161616; padding: 1.2vw; box-sizing: border-box; }
  canvas { width: 100%; height: 100%; display: block; }
  #help { position: fixed; left: 0; right: 0; bottom: 1.2vh; text-align: center; color: #555; font: 1.4vw system-ui, sans-serif; }
</style>
</head>
<body>
<div id="wrap"><div id="frame"><canvas id="screen"></canvas></div></div>
<div id="help"></div>
<script type="module">
import { LedCanvas } from './js/lib/led-canvas.js?v=3';
import { Arcade } from './js/engine.js?v=3';
import games from './js/games/index.js?v=3';

// Screen size in LEDs. Default is the 2-panel wall (128x64). Change with ?size=192x64 (3 panels), ?size=128x128, ?size=64x32 ...
const q = new URLSearchParams(location.search).get('size');
if (q && /^\d+x\d+$/.test(q)) localStorage.setItem('dawgArcade:size', q);
const [W, H] = (localStorage.getItem('dawgArcade:size') || '128x64').split('x').map(Number);

const frameEl = document.getElementById('frame');
function fit() {
  const k = Math.min(innerWidth * 0.96 / W, innerHeight * 0.9 / H);
  frameEl.style.width = W * k + 'px'; frameEl.style.height = H * k + 'px';
  led.resize();
}
const led = new LedCanvas(document.getElementById('screen'), { w: W, h: H });
addEventListener('resize', fit); fit();

const HOME = 'https://samahlersmeyer-prog.github.io/pixel-wall/pi/menu/?demo';
const arcade = new Arcade(games, { W, H, onHome: () => { location.href = HOME; } });
document.getElementById('help').textContent = 'P1: W A S D + F   ·   P2: arrows + Enter   ·   P pause   ·   Esc home   ·   or plug in 2 controllers';
setTimeout(() => document.getElementById('help').style.display = 'none', 12000);

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { arcade.step(1 / 60); acc -= 1 / 60; }
  led.draw(arcade.draw());
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('dblclick', () => document.documentElement.requestFullscreen?.());
</script>
</body>
</html>
